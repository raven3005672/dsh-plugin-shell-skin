# Publish the package from CI through npm Trusted Publishing (OIDC).
#
# No npm token and no one-time password: npm trusts this workflow because
# GitHub signs a short-lived OIDC token naming this repository and file.
# Prerequisite, done once on npmjs.com:
#   package page -> Settings -> Trusted publisher -> GitHub Actions
#   organization/user: raven3005672
#   repository:        dsh-plugin-shell-skin
#   workflow filename: publish.yml
#
# Release: bump the version, commit, then push a matching tag:
#   git tag v0.1.4 && git push origin v0.1.4

name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.2+; the bundled one may be older.
      - run: npm install --global npm@latest

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm smoke

      # prepack builds lib/, prepublishOnly re-runs the checks.
      - run: npm publish --provenance

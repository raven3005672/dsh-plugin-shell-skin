# Promote a published version to `latest` without a long-lived token.
#
# Trusted publishing must have "Allow npm dist-tag" enabled for this
# configuration (npm package settings -> Trusted publishing).
#
# Usage: git tag retag-0.2.0 && git push origin retag-0.2.0
name: dist-tag

on:
  push:
    tags: ['retag-*']

permissions:
  contents: read
  id-token: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@latest
      - name: Promote the tagged version to latest
        run: npm dist-tag add "dsh-plugin-shell-skin@${GITHUB_REF_NAME#retag-}" latest

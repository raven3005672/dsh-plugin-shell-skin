# Local development overlay: mount shell-skin straight from this checkout.
# Run from the deepseek-harness checkout:
#   pnpm dsh web --patch ../dsh-plugin-shell-skin/dev.patch.yml
- insert:
    - id: dsh-plugin-shell-skin
      name: /Users/yanglin/github/dsh-plugin-shell-skin/lib/index.js
      config:
        splash: true
        lightOpacity: 0.82
        darkOpacity: 0.52
        bootColorLight: '#ffffff'
        bootColorDark: '#0c0f15'
